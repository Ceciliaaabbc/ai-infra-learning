<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img">
<title>因果自注意力的内部步骤</title>
<desc>x 经过 c_attn 得到 q、k、v，拆成多头后，naive 实现依次计算分数、因果 mask、softmax、加权求和，前三步会生成 T 乘 T 的大矩阵；sdpa 实现用 FlashAttention 把四步融合成一个 kernel 并分块计算。两条路径的结果合并多头，再经过 c_proj 输出投影。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.left{text-anchor:start}
rect{stroke-width:1}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.container{fill:none;stroke:#B4B2A9;stroke-dasharray:4 4}
.label{fill:#2C2C2A}.note{fill:#5F5E5A}
.g-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.g-gray .th{fill:#444441}
.g-coral rect{fill:#FAECE7;stroke:#993C1D}.g-coral .th{fill:#712B13}
.g-teal rect{fill:#E1F5EE;stroke:#0F6E56}.g-teal .th{fill:#085041}.g-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="770" rx="12" fill="#FFFFFF"/>
<g class="g-teal"><rect x="80" y="30" width="560" height="56" rx="8"/><text class="th" x="360" y="48">c_attn：一个线性层同时算出 q、k、v</text><text class="ts" x="360" y="68">(B, T, C) → 三份 (B, T, C)</text></g>
<line x1="360" y1="86" x2="360" y2="118" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="80" y="120" width="560" height="56" rx="8"/><text class="th" x="360" y="138">拆成 nh 个头</text><text class="ts" x="360" y="158">view + transpose → (B, nh, T, hd)</text></g>
<rect x="60" y="200" width="280" height="320" rx="8" class="container"/>
<text class="th label left" x="76" y="222">naive：手写四步</text>
<rect x="360" y="200" width="280" height="320" rx="8" class="container"/>
<text class="th label left" x="376" y="222">sdpa：FlashAttention</text>
<line x1="290" y1="176" x2="290" y2="244" class="arr" marker-end="url(#a)"/>
<line x1="600" y1="176" x2="600" y2="244" class="arr" marker-end="url(#a)"/>
<g class="g-coral"><rect x="80" y="246" width="240" height="44" rx="8"/><text class="th" x="200" y="268">分数 q·kᵀ / √hd</text></g>
<line x1="200" y1="290" x2="200" y2="314" class="arr" marker-end="url(#a)"/>
<g class="g-coral"><rect x="80" y="316" width="240" height="44" rx="8"/><text class="th" x="200" y="338">因果 mask：未来设为 -inf</text></g>
<line x1="200" y1="360" x2="200" y2="384" class="arr" marker-end="url(#a)"/>
<g class="g-coral"><rect x="80" y="386" width="240" height="44" rx="8"/><text class="th" x="200" y="408">softmax：每行加起来为 1</text></g>
<line x1="200" y1="430" x2="200" y2="454" class="arr" marker-end="url(#a)"/>
<g class="g-gray"><rect x="80" y="456" width="240" height="44" rx="8"/><text class="th" x="200" y="478">加权求和：att @ v</text></g>
<g class="g-teal"><rect x="380" y="246" width="240" height="254" rx="8"/><text class="th" x="500" y="350">FlashAttention</text><text class="ts" x="500" y="376">四步融合成一个 kernel</text><text class="ts" x="500" y="398">分块计算，不存 T×T 矩阵</text></g>
<line x1="200" y1="500" x2="200" y2="558" class="arr" marker-end="url(#a)"/>
<line x1="500" y1="500" x2="500" y2="558" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="80" y="560" width="560" height="56" rx="8"/><text class="th" x="360" y="578">合并多头</text><text class="ts" x="360" y="598">(B, nh, T, hd) → (B, T, C)</text></g>
<line x1="360" y1="616" x2="360" y2="648" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="80" y="650" width="560" height="56" rx="8"/><text class="th" x="360" y="668">c_proj 输出投影</text><text class="ts" x="360" y="688">混合各头的信息，加回残差流</text></g>
<g class="g-coral"><rect x="80" y="728" width="14" height="14" rx="2"/></g>
<text class="ts note left" x="102" y="735">会生成 (B, nh, T, T) 大小的矩阵，显存随 T² 增长</text>
</svg>
