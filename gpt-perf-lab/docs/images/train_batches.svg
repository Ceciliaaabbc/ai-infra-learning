<svg xmlns="http://www.w3.org/2000/svg" width="680" height="456" viewBox="0 0 680 456" role="img">
<title>Batches 取一批数据的流程</title>
<desc>从 train.bin 按需读取 token，随机选 B 个起点，每个起点取 T+1 个 token，错开一位切成 x 和 y，再拷贝到 GPU。右侧例子：原文 The cat sat on the mat，x 是前 5 个 token，y 是后 5 个 token，每一列表示看到 x 要猜 y。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.left{text-anchor:start}
rect{stroke-width:1}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.container{fill:none;stroke:#B4B2A9;stroke-dasharray:4 4}
.label{fill:#2C2C2A}.note{fill:#5F5E5A}
.g-box rect{fill:#FFFFFF;stroke:#B4B2A9}.g-box .th{fill:#2C2C2A}.g-box .ts{fill:#5F5E5A}
.g-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.g-gray .ts{fill:#444441}
.g-teal rect{fill:#E1F5EE;stroke:#0F6E56}.g-teal .ts{fill:#085041}
.g-coral rect{fill:#FAECE7;stroke:#993C1D}.g-coral .ts{fill:#712B13}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="456" rx="12" fill="#FFFFFF"/>
<g class="g-box"><rect x="40" y="30" width="300" height="56" rx="8"/><text class="th" x="190" y="48">train.bin（memmap）</text><text class="ts" x="190" y="68">按需读取，不整个读进内存</text></g>
<line x1="190" y1="86" x2="190" y2="112" class="arr" marker-end="url(#a)"/>
<g class="g-box"><rect x="40" y="114" width="300" height="56" rx="8"/><text class="th" x="190" y="132">随机选 B 个起点</text><text class="ts" x="190" y="152">np.random.randint</text></g>
<line x1="190" y1="170" x2="190" y2="196" class="arr" marker-end="url(#a)"/>
<g class="g-box"><rect x="40" y="198" width="300" height="56" rx="8"/><text class="th" x="190" y="216">每个起点取 T+1 个 token</text><text class="ts" x="190" y="236">拼成 (B, T+1)，转成 int64</text></g>
<line x1="190" y1="254" x2="190" y2="280" class="arr" marker-end="url(#a)"/>
<g class="g-box"><rect x="40" y="282" width="300" height="56" rx="8"/><text class="th" x="190" y="300">错开一位，切成 x 和 y</text><text class="ts" x="190" y="320">x 取前 T 个，y 取后 T 个</text></g>
<line x1="190" y1="338" x2="190" y2="364" class="arr" marker-end="url(#a)"/>
<g class="g-box"><rect x="40" y="366" width="300" height="56" rx="8"/><text class="th" x="190" y="384">拷贝到 GPU</text><text class="ts" x="190" y="404">pin_memory + non_blocking</text></g>
<rect x="370" y="180" width="270" height="186" rx="8" class="container"/>
<text class="th label left" x="386" y="200">例子：T = 5</text>
<text class="ts note left" x="386" y="234">原文</text>
<g class="g-gray"><rect x="420" y="220" width="32" height="28" rx="4"/><text class="ts" x="436" y="234">The</text></g>
<g class="g-gray"><rect x="455" y="220" width="32" height="28" rx="4"/><text class="ts" x="471" y="234">cat</text></g>
<g class="g-gray"><rect x="490" y="220" width="32" height="28" rx="4"/><text class="ts" x="506" y="234">sat</text></g>
<g class="g-gray"><rect x="525" y="220" width="32" height="28" rx="4"/><text class="ts" x="541" y="234">on</text></g>
<g class="g-gray"><rect x="560" y="220" width="32" height="28" rx="4"/><text class="ts" x="576" y="234">the</text></g>
<g class="g-gray"><rect x="595" y="220" width="32" height="28" rx="4"/><text class="ts" x="611" y="234">mat</text></g>
<text class="ts note left" x="386" y="276">x</text>
<g class="g-teal"><rect x="420" y="262" width="32" height="28" rx="4"/><text class="ts" x="436" y="276">The</text></g>
<g class="g-teal"><rect x="455" y="262" width="32" height="28" rx="4"/><text class="ts" x="471" y="276">cat</text></g>
<g class="g-teal"><rect x="490" y="262" width="32" height="28" rx="4"/><text class="ts" x="506" y="276">sat</text></g>
<g class="g-teal"><rect x="525" y="262" width="32" height="28" rx="4"/><text class="ts" x="541" y="276">on</text></g>
<g class="g-teal"><rect x="560" y="262" width="32" height="28" rx="4"/><text class="ts" x="576" y="276">the</text></g>
<text class="ts note left" x="386" y="318">y</text>
<g class="g-coral"><rect x="420" y="304" width="32" height="28" rx="4"/><text class="ts" x="436" y="318">cat</text></g>
<g class="g-coral"><rect x="455" y="304" width="32" height="28" rx="4"/><text class="ts" x="471" y="318">sat</text></g>
<g class="g-coral"><rect x="490" y="304" width="32" height="28" rx="4"/><text class="ts" x="506" y="318">on</text></g>
<g class="g-coral"><rect x="525" y="304" width="32" height="28" rx="4"/><text class="ts" x="541" y="318">the</text></g>
<g class="g-coral"><rect x="560" y="304" width="32" height="28" rx="4"/><text class="ts" x="576" y="318">mat</text></g>
<text class="ts note left" x="386" y="350">每一列：看到 x，要猜 y</text>
</svg>
