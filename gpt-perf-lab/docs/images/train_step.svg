<svg xmlns="http://www.w3.org/2000/svg" width="680" height="830" viewBox="0 0 680 830" role="img">
<title>一步训练 train_step 的内部流程</title>
<desc>开始计时后，设置学习率、清空梯度，然后重复 grad_accum 次：取一批数据、在 autocast 里前向并计算 loss、反向传播累加梯度；之后做梯度裁剪、更新参数，最后结束计时。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.left{text-anchor:start}
rect{stroke-width:1}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.container{fill:none;stroke:#B4B2A9;stroke-dasharray:4 4}
.label{fill:#2C2C2A}.note{fill:#5F5E5A}
.g-purple rect{fill:#EEEDFE;stroke:#534AB7}.g-purple .th{fill:#3C3489}.g-purple .ts{fill:#534AB7}
.g-teal rect{fill:#E1F5EE;stroke:#0F6E56}.g-teal .th{fill:#085041}.g-teal .ts{fill:#0F6E56}
.g-coral rect{fill:#FAECE7;stroke:#993C1D}.g-coral .th{fill:#712B13}.g-coral .ts{fill:#993C1D}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="830" rx="12" fill="#FFFFFF"/>
<g class="g-coral"><rect x="160" y="30" width="360" height="56" rx="8"/><text class="th" x="340" y="48">开始计时</text><text class="ts" x="340" y="68">timer.start：先等 GPU 空闲</text></g>
<line x1="340" y1="86" x2="340" y2="108" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="160" y="110" width="360" height="56" rx="8"/><text class="th" x="340" y="128">设置学习率</text><text class="ts" x="340" y="148">get_lr(step)</text></g>
<line x1="340" y1="166" x2="340" y2="188" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="160" y="190" width="360" height="56" rx="8"/><text class="th" x="340" y="208">清空梯度</text><text class="ts" x="340" y="228">optimizer.zero_grad</text></g>
<rect x="120" y="270" width="440" height="268" rx="8" class="container"/>
<text class="th label left" x="136" y="290">↻ 重复 grad_accum 次</text>
<line x1="340" y1="246" x2="340" y2="304" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="160" y="306" width="360" height="56" rx="8"/><text class="th" x="340" y="324">取一批数据</text><text class="ts" x="340" y="344">batches.next() → x, y</text></g>
<line x1="340" y1="362" x2="340" y2="384" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="160" y="386" width="360" height="56" rx="8"/><text class="th" x="340" y="404">前向 + 算 loss</text><text class="ts" x="340" y="424">在 autocast 里，loss ÷ grad_accum</text></g>
<line x1="340" y1="442" x2="340" y2="464" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="160" y="466" width="360" height="56" rx="8"/><text class="th" x="340" y="484">反向传播</text><text class="ts" x="340" y="504">loss.backward()：梯度累加</text></g>
<line x1="340" y1="522" x2="340" y2="560" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="160" y="562" width="360" height="56" rx="8"/><text class="th" x="340" y="580">梯度裁剪</text><text class="ts" x="340" y="600">总长度超过 1.0 就按比例缩小</text></g>
<line x1="340" y1="618" x2="340" y2="640" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="160" y="642" width="360" height="56" rx="8"/><text class="th" x="340" y="660">更新参数</text><text class="ts" x="340" y="680">optimizer.step()</text></g>
<line x1="340" y1="698" x2="340" y2="720" class="arr" marker-end="url(#a)"/>
<g class="g-coral"><rect x="160" y="722" width="360" height="56" rx="8"/><text class="th" x="340" y="740">结束计时</text><text class="ts" x="340" y="760">timer.stop：再等 GPU 算完</text></g>
<g class="g-coral"><rect x="160" y="793" width="14" height="14" rx="2"/></g><text class="ts note left" x="182" y="800">计时</text>
<g class="g-purple"><rect x="250" y="793" width="14" height="14" rx="2"/></g><text class="ts note left" x="272" y="800">参数更新相关</text>
<g class="g-teal"><rect x="390" y="793" width="14" height="14" rx="2"/></g><text class="ts note left" x="412" y="800">计算梯度</text>
</svg>
