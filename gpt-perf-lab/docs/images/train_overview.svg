<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img">
<title>train.py 整体流程</title>
<desc>读取命令行参数，设置设备、随机种子和精度，准备模型、优化器、compile 和数据；默认进入 50 步训练循环并计时，汇总结果后追加到 results.csv；加了 --profile 时改为采样 5 步，导出时间线文件。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
rect{stroke-width:1}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.g-box rect{fill:#FFFFFF;stroke:#B4B2A9}.g-box .th{fill:#2C2C2A}.g-box .ts{fill:#5F5E5A}
.g-purple rect{fill:#EEEDFE;stroke:#534AB7}.g-purple .th{fill:#3C3489}.g-purple .ts{fill:#534AB7}
.g-teal rect{fill:#E1F5EE;stroke:#0F6E56}.g-teal .th{fill:#085041}.g-teal .ts{fill:#0F6E56}
.g-coral rect{fill:#FAECE7;stroke:#993C1D}.g-coral .th{fill:#712B13}.g-coral .ts{fill:#993C1D}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="590" rx="12" fill="#FFFFFF"/>
<g class="g-purple"><rect x="170" y="30" width="340" height="56" rx="8"/><text class="th" x="340" y="48">读取命令行参数</text><text class="ts" x="340" y="68">parse_args：决定打开哪些优化</text></g>
<line x1="340" y1="86" x2="340" y2="118" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="170" y="120" width="340" height="56" rx="8"/><text class="th" x="340" y="138">设备、随机种子、精度</text><text class="ts" x="340" y="158">选 GPU，设置 TF32 和 bf16</text></g>
<line x1="340" y1="176" x2="340" y2="208" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="170" y="210" width="340" height="56" rx="8"/><text class="th" x="340" y="228">准备</text><text class="ts" x="340" y="248">模型、优化器、compile、数据</text></g>
<line x1="190" y1="266" x2="190" y2="318" class="arr" marker-end="url(#a)"/>
<line x1="490" y1="266" x2="490" y2="318" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="60" y="320" width="260" height="56" rx="8"/><text class="th" x="190" y="338">训练循环</text><text class="ts" x="190" y="358">默认：跑 50 步，逐步计时</text></g>
<g class="g-coral"><rect x="360" y="320" width="260" height="56" rx="8"/><text class="th" x="490" y="338">Profiling</text><text class="ts" x="490" y="358">加了 --profile：采样 5 步</text></g>
<line x1="190" y1="376" x2="190" y2="408" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="60" y="410" width="260" height="56" rx="8"/><text class="th" x="190" y="428">汇总结果</text><text class="ts" x="190" y="448">tokens/s、MFU、显存、loss</text></g>
<line x1="190" y1="466" x2="190" y2="498" class="arr" marker-end="url(#a)"/>
<g class="g-box"><rect x="60" y="500" width="260" height="56" rx="8"/><text class="th" x="190" y="518">results.csv</text><text class="ts" x="190" y="538">追加一行实验结果</text></g>
<line x1="490" y1="376" x2="490" y2="408" class="arr" marker-end="url(#a)"/>
<g class="g-box"><rect x="360" y="410" width="260" height="56" rx="8"/><text class="th" x="490" y="428">traces/标签.json</text><text class="ts" x="490" y="448">时间线文件，用 Perfetto 查看</text></g>
</svg>
