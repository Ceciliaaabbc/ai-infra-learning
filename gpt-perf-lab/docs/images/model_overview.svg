<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img">
<title>model.py 整体数据流</title>
<desc>token 编号依次经过 Embedding 层、12 个 Block、输出层得到 logits，再和 targets 计算交叉熵 loss；Embedding 层和输出层共享同一个权重矩阵。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
rect,circle{stroke-width:1}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:1;stroke-dasharray:4 3;fill:none}
.g-box rect{fill:#FFFFFF;stroke:#B4B2A9}.g-box .th{fill:#2C2C2A}.g-box .ts{fill:#5F5E5A}
.g-purple rect{fill:#EEEDFE;stroke:#534AB7}.g-purple .th{fill:#3C3489}.g-purple .ts{fill:#534AB7}
.g-teal rect{fill:#E1F5EE;stroke:#0F6E56}.g-teal .th{fill:#085041}.g-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="480" rx="12" fill="#FFFFFF"/>
<g class="g-box"><rect x="140" y="30" width="260" height="56" rx="8"/><text class="th" x="270" y="48">输入 token 编号</text><text class="ts" x="270" y="68">idx：(B, T)</text></g>
<line x1="270" y1="86" x2="270" y2="118" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="140" y="120" width="260" height="56" rx="8"/><text class="th" x="270" y="138">Embedding 层</text><text class="ts" x="270" y="158">查表相加 → (B, T, C)</text></g>
<line x1="270" y1="176" x2="270" y2="208" class="arr" marker-end="url(#a)"/>
<g class="g-teal"><rect x="140" y="210" width="260" height="56" rx="8"/><text class="th" x="270" y="228">Block × 12</text><text class="ts" x="270" y="248">形状不变 (B, T, C)</text></g>
<line x1="270" y1="266" x2="270" y2="298" class="arr" marker-end="url(#a)"/>
<g class="g-purple"><rect x="140" y="300" width="260" height="56" rx="8"/><text class="th" x="270" y="318">输出层</text><text class="ts" x="270" y="338">ln_f → lm_head → (B, T, V)</text></g>
<line x1="270" y1="356" x2="270" y2="388" class="arr" marker-end="url(#a)"/>
<g class="g-box"><rect x="140" y="390" width="260" height="56" rx="8"/><text class="th" x="270" y="408">Loss</text><text class="ts" x="270" y="428">交叉熵：和 targets 比较</text></g>
<g class="g-purple"><rect x="450" y="210" width="190" height="56" rx="8"/><text class="th" x="545" y="228">权重共享</text><text class="ts" x="545" y="248">wte 与 lm_head 同一矩阵</text></g>
<path d="M450 230 L425 230 L425 148 L402 148" class="leader"/>
<path d="M450 246 L425 246 L425 328 L402 328" class="leader"/>
</svg>
